<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
    <header>
        <h1>{{ app_name }}</h1>
        <p>DPO 파인튜닝 모델을 vLLM과 FastAPI로 실행하는 한국어 채팅 실습</p>
    </header>

    <section class="panel">
        <h2>서버 상태</h2>
        <button id="fastapiHealthButton">FastAPI 상태</button>
        <button id="vllmHealthButton">vLLM 상태</button>
        <pre id="healthResult">상태 확인 버튼을 누르세요.</pre>
    </section>

    <section class="panel">
        <h2>한국어 채팅</h2>

        <label for="systemPrompt">System Prompt</label>
        <textarea id="systemPrompt" rows="3">당신은 정확하고 친절한 한국어 고객 상담 AI입니다. 확인되지 않은 사실을 만들지 마세요.</textarea>

        <label for="message">질문</label>
        <textarea id="message" rows="5">배송이 늦어서 화가 납니다. 어떻게 처리할 수 있나요?</textarea>

        <div class="grid">
            <div>
                <label for="temperature">Temperature</label>
                <input id="temperature" type="number" value="0.2" min="0" max="2" step="0.1">
            </div>
            <div>
                <label for="maxTokens">Max Tokens</label>
                <input id="maxTokens" type="number" value="512" min="1" max="4096">
            </div>
        </div>

        <button id="chatButton">답변 생성</button>
        <pre id="chatResult">답변이 여기에 표시됩니다.</pre>
    </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
