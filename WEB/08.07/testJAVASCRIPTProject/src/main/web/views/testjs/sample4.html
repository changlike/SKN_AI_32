<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sample4</title>
</head>
<body>
    <h1>자바스크립트 document 객체가 제공하는 메소드 중 태그 객체 정보를 얻는 메소드 사용 테스트</h1>
    <ol>
        <li>var 태그객체저장변수 = document.getElementById('아이디명');</li>
        <button onclick="getId();">아이디로 태그 정보 얻기</button>
        <div id="box" style="background: orange;width: 200px;height: 100px;">box 영역입니다...</div>
        <script type="text/javascript">
            console.log('브라우저가 문서를 한줄씩 읽어 내려가면서 자동으로 실행되는 구문임');
            // 함수(function) : 프로그램 코드 구문들을 작성해서 따로 묶어서 이름을 붙여준 것 (기능별로 분리 작성한 코드들의 묶음)
            // 좋은 함수는 기능 하나에 대한 코드를 작성하는 것임
            function getId(){
                var boxDiv = document.getElementById('box');
                console.log('변수는 1개만 저장함 : ' + boxDiv.length); //배열변수가 아니므로, undefined 로 확인됨
                boxDiv.style.backgroundColor = 'olive';
                alert('box div 태그 안에 기록된 문자열 : ' + boxDiv.innerHTML + '\n배경색 : ' + boxDiv.style.backgroundColor);
                boxDiv.innerHTML = '자바스크립트에서 box 안의 문자열 정보 바꿈';
            }
        </script>
        <hr>

        <li>var 태그배열변수 = document.getElementsByName('name 속성에 지정한 이름');</li>
        <p>
            <input type="checkbox" name="icecream" value="브라보콘"> 브라보콘 &nbsp;
            <input type="checkbox" name="icecream" value="구구콘"> 구구콘 &nbsp;
            <input type="checkbox" name="icecream" value="자유시간콘"> 자유시간콘 &nbsp;
            <input type="checkbox" name="icecream" value="월드콘"> 월드콘 &nbsp;
        </p>
        <button onclick="showValues();">이름(name)으로 접근</button> <br>
        <script type="text/javascript">
            function showValues(){
                var iceCream = document.getElementsByName('icecream');
                console.log('조회된 태그 갯수 : ' + iceCream.length);  //배열변수에는 length property 사용할 수 있음

                //배열 공간은 변수방 여러 개를 메모리에 연속 나열 할당하고, 하나의 이름으로 지정한 공간임
                //배열 공간안에 저장된 항목(변수방들)들은 자동으로 순번이 부여됨, 순번(index)은 0부터 시작함
                //각 변수방에 접근할 때는 배열명[순번]으로 표기하면 됨, iceCream[0], iceCream[1], ......, iceCream[length - 1] (마지막임)

                //배열을 처리하는 반복문(loop문)으로 for 문을 주로 사용함
                /*
                    for(반복의 시작값; 반복의 종료값지정; 증감식){
                        반복시킬 구문;
                    }
                */
                for(var i = 0; i < iceCream.length; i++){
                    console.log(i + ' : ' + iceCream[i].value + '\n');
                }
            }
        </script>
        <hr>

        <li>var 태그배열변수 = document.getElementsByTagName('태그명');</li>
        <button onclick="showList();">태그명으로 접근</button>
        <div id="box2" style="width: 500px;height: 400px;border: 2px solid red;"></div>
        <script type="text/javascript">
            function showList(){
                var liTags = document.getElementsByTagName('li');
                console.log('조회된 li 태그 갯수 : ' + liTags.length);

                var box2 = document.getElementById('box2');

                for(var i = 0; i < liTags.length; i++){
                    box2.innerHTML += liTags[i].innerHTML + '<br>';
                }
            }
        </script>
    </ol>
</body>
</html>
