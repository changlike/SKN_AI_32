<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sample9</title>
    <script type="text/javascript">
        function changeBg(color){
            document.body.style.backgroundColor = color;
        }

        //자바스크립트에서 이벤트에 대한 콜백함수(익명함수로 작성) 작성은 반드시 
        //window.onload 이벤트 콜백함수 안에서 작성해야 함
        window.onload = function(){
            var rangeTag = document.getElementById('fntSize');  
            rangeTag.onchange = function(){
                document.getElementById('h1').style.fontSize = rangeTag.value + 'pt';
            };

            //DOM level2 방식의 이벤트 처리
            var okBtn = document.getElementById('ok');
            if(okBtn.attatchEvent){  //브라우저가 attatchEvent 메소드를 제공하면 true 임
                //인터넷 익스플로러이면
                okBtn.attatchEvent('onclick', function(){
                    document.getElementById('hh').innerHTML = 
                        'IE : ' + document.getElementById('newText').value;
                });
            }else{  //인터넷 익스플로러 브라우저자 아닐 때
                okBtn.addEventListener('click', function(){
                    document.getElementById('hh').innerHTML = document.getElementById('newText').value;
                });
            }
        };  //window.onload
    </script>
</head>
<body>
    <h1 id="h1">자바스크립트에서 이벤트 다루기</h1>
    <h2>select 에서 색이름을 선택하면, body 의 배경색이 바뀌게 함</h2>
    배경색 선택 : 
    <select onchange="changeBg(this.value);"> <!-- 선택값이 변경되면(이벤트) 선택된 값을 함수로 전달함 -->
        <option value="white" selected>흰색</option>
        <option value="yellow">노란색</option>
        <option value="pink">핑크색</option>
        <option value="orange">오렌지색</option>
        <option value="cyan">하늘색</option>
    </select>
    <br>
    <hr>

    <h2>input 의 range 의 값이 변경되면 h1 태그의 글자크기가 바뀌게 함</h2>
    글자 크기 선택 : 
    <input type="range" min="10" max="100" step="10" id="fntSize"> <br>
    <hr>

    <h2>input 의 값을 입력하고, 확인 버튼을 누르면 입력값으로 제목 글자를 바꿈</h2>
    <h1 id="hh">제목 글자를 바꿔보세요.</h1>
    <input type="text" id="newText"> <br>
    <input type="button" value="확인" id="ok"> <br>
    <hr>

    <h2>실습 : 폼(form) 입력양식(input)에 값을 입력하고, 추가 버튼을 누르면 입력값들을 
        아래쪽의 테이블에 한줄씩 추가되게 해 보시오.
    </h2>
    <form method="post" action="">
        <label>이름 : <input type="text" id="name"></label> <br>
        <label>나이 : <input type="text" id="age"></label> <br>
        <label>성별 : 
            <input type="radio" name="gender" value="M"> 남자
            <input type="radio" name="gender" value="F"> 여자 
        </label> <br>
        <label>전화번호 : <input type="tel" id="phone"></label> <br>
        <label>취미 : 
            <input type="checkbox" name="hobby" value="movie"> 영화감상
            <input type="checkbox" name="hobby" value="music"> 음악감상
            <input type="checkbox" name="hobby" value="sport"> 운동
            <input type="checkbox" name="hobby" value="travel"> 여행
            <input type="checkbox" name="hobby" value="climb"> 등산
        </label> <br>
        <input type="button" value="추가하기" id="addBtn"> <br>
    </form>
    <p id="p3">
        <table id="tbl" width="500" border="1" cellspacing="0">
            <tr>
                <th>이름</th>
                <th>나이</th>
                <th>성별</th>
                <th>전화번호</th>
                <th>취미</th>
            </tr>
            <!-- 입력값들로 새로운 행을 추가해 나감 -->
        </table>
    </p>

    <script type="text/javascript">
        function User(){
            //property
            this.name = null;
            this.age = 0;
            this.gender = null;
            this.phone = null;
            this.hobby = null;

            //method
            this.setUser = function(n, a, g, p, h){
                this.name = n;
                this.age = a;
                this.gender = g;
                this.phone = p;
                this.hobby = h;
            };

            this.makeRow = function(){
                //tr 태그에 대한 문자열 작성 리턴 처리
                var str = '<tr><td>' + this.name + '</td><td>' + this.age + '</td><td>'
                        + this.gender + '</td><td>' + this.phone + '</td><td>' + this.hobby 
                        + '</td></tr>';
                return str;
            };
        }

        window.onload = function(){
            //addBtn 클릭에 대한 이벤트 지정함
            document.getElementById('addBtn').onclick = function(){
                //input 에 기록 또는 선택, 체크된 값들을 가지고 옴
                var name = document.getElementById('name').value;
                var age = document.getElementById('age').value;
                var genders = document.getElementsByName('gender');
                var gender = '';
                if(genders[0].checked == true){
                    gender = '남자';
                }else if(genders[1].checked == true){
                    gender = '여자';
                }
                var phone = document.getElementById('phone').value;
                //체크박스의 체크된 값들은 하나의 문자열로 만듦
                var hobby = document.getElementsByName('hobby');
                var hobbyList = '';
                for(var i in hobby){
                    if(hobby[i].checked == true){
                        hobbyList += hobby[i].value + ' ';
                    }
                }

                //User 객체 생성하고, 사용자 정보 저장한 다음 행 만들어 추가 처리함
                var user = new User();
                user.setUser(name, age, gender, phone, hobbyList);

                document.getElementById('tbl').innerHTML += user.makeRow();
            }; //addBtn.onclick
        };  //window.onload
    </script>


    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
