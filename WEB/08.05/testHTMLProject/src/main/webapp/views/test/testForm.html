<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testForm</title>
</head>
<body>
    <header>
        <h1>웹 폼(form) 사용 연습 페이지</h1>
    </header>
    <hr>
    <div id="loginDiv">
        <form action="result.html" method="post">
            <table width="250" cellspacing="0" cellpadding="0">
                <tr><td>
                    <input type="text" name="userid" size="20" maxlength="15" 
                    placeholder="아이디를 입력하세요" autofocus autocomplete required>
                </td></tr>
                <tr><td>
                    <input type="password" name="userpwd" size="20" maxlength="15" 
                    placeholder="암호를 입력하세요" required>
                </td></tr>
                <tr><td>
                    <input type="submit" value="로그인">
                </td></tr>
            </table>
        </form>
    </div>
    <hr>

    <!--
    form 태그 : 서버로 입력값들을 전송하기 위해서 사용하는 태그임
    필수 속성 : 
        action="전송값들을 받을 서버측 대상의 이름"
            MVC 디자인 패턴 (공인된 국제 표준 프로그램 개발 방법론)이 적용된 애플리케이션이면,
            서버측 컨트롤러(Controller : 자바 클래스)의 이름을 action 에 지정하면 됨
            뷰(View) - 컨트롤러(Controller) - 모델(Model) - 데이터베이스에 sql문 전송 결과 처리

        method="post | get", 서버측으로 입력값(input data)들을 전송하는 방식 지정 (기본은 get)
            post : request(요청) 객체의 body에 입력값(전송값)들이 기록되어 전송됨
                    브라우저 주소표시줄(location bar)에 전송값이 안 보임 (권장)
            get : request(요청) 객체의 head에 전송값들이 기록되어 전송됨
                    주소표시줄에 url(http://ip주소:port번호/프로젝트이름)과 함께 전송값이 보여짐

    form 태그 안에 값 입력 또는 선택을 위한 입력양식(input) 태그들을 작성함
    input 태그들은 종류를 주로 type="종류" 로 구분해서 사용함
    type="text" : 한 줄짜리 글자 입력 양식 (textfield), 입력한 글자가 보여짐
    type="password" : 암호 입력양식, 입력하는 글자가 ****** 으로 보여짐 (키보드 자판이 자동으로 영어로 바뀜)
    type="submit" : 전송 버튼, form 태그 안에 한 개만 존재해야 함

    input 태그 속성 : 
        name="input의 이름", 서버로 전송될 때 이름=입력값 형태로 전송됨 (서버측에서는 이름으로 값을 추출해서 사용함)
            이름 없는 input 은 전송되지 않음
        size="input의 가로크기", 단위는 글자수
        maxlength="최대입력가능글자수", 글자수 초과되면 더 이상 값 기록이 안 됨
        placeholder="input에 배경에 표시될 설명글자", 값을 기록하면 사라짐 (html5 추가된 속성)
        autofocus 또는 autofocus="on | off", 깜빡이는 입력 커서가 자동 표시되게 함 (html5 추가된 속성)
        autocomplete 또는 autocomplete="on | off", 자동 단어 완성 (한 번 기록된 단어를 기억해서 다시 입력시 자동 표시됨), (html5 추가된 속성)
        value="input에 출력할 값"

    버튼 형태의 input 태그들
        input type="submit" : 전송 버튼, 클릭하면 form 태그 안의 input 값들이 action 대상에게 전송이 가게 됨
        input type="reset" : 리셋(취소) 버튼, 클릭하면 form 태그 안의 input 값들이 전부 삭제됨 (초기화됨)
        input type="button" : 일반 버튼
        input type="image" : 그림으로 제공되는 버튼
        사용 속성 : value="버튼에 표시될 글자"
    -->

    <hgroup>
        <h2>입력 양식 태그들 확인</h2>
    </hgroup>

    <form action="result.html" method="get">
        <table width="750">
            <tr>
                <th width="150">취미</th>
                <td width="600">
                    <!-- 체크박스는 이름을 같게 해서 하나의 그룹을 만듦
                        그룹 안에서 여러 개 선택 가능함
                        체크 표시된 항목의 값(value)이 이름=값&이름=값 형태로 전송됨 
                    -->
                    <input type="checkbox" name="hobby" value="게임"> 게임 &nbsp;
                    <input type="checkbox" name="hobby" value="여행"> 여행 &nbsp;
                    <input type="checkbox" name="hobby" value="운동"> 운동 &nbsp; <br>
                    <input type="checkbox" name="hobby" value="독서"> 독서 &nbsp;
                    <input type="checkbox" name="hobby" value="요리"> 요리 &nbsp;
                    <input type="checkbox" name="hobby" value="기타"> 기타 &nbsp;
                </td>
            </tr>
            <tr><th>성별</th><td>
                <input type="radio" name="gender" value="남"> 남자 &nbsp;
                <input type="radio" name="gender" value="여"> 여자
            </td></tr>
            <tr><th>직업</th><td>
                <select name="job">
                    <option>직업을 선택</option>
                    <option value="회사원">회사원</option>
                    <option value="학생">학생</option>
                    <option value="주부">주부</option>
                    <option value="기타">기타</option>
                </select>
            </td></tr>
            <tr><th>내용</th><td>
                <textarea name="content" rows="5" cols="50"></textarea>
                <!--
                    rows="줄수", cols="칸수" 글자수로 지정
                -->
            </td></tr>
            <tr><th colspan="2" bgcolor="yellow">html5에서 추가된 입력양식 태그들 확인</th></tr>
            <tr><th>주문내용</th><td>
                <fieldset>
                    <!-- fieldset 태그 : form 태그 안에서 사용함
                        input 태그들을 그룹 묶어서 표현할 때 사용함 
                    -->
                    <legend>토핑 선택</legend>
                    <!-- fieldset 으로 묶은 input 그룹에 대한 항목 제목을 표시할 때 사용
                        fieldset 안에서 바로 아래에 사용함 
                    -->
                    <input type="checkbox" name="topping" value="bacon"> 베이컨 <br>
                    <input type="checkbox" name="topping" value="cheese"> 치즈 <br>
                    <input type="checkbox" name="topping" value="onion"> 양파 <br>
                    <input type="checkbox" name="topping" value="mushroom"> 버섯 <br>
                </fieldset>
            </td></tr>
            <tr><th>전화번호</th><td>
                <input type="tel" name="phone">
            </td></tr>
            <tr><th>이메일</th><td>
                <input type="email" name="cemail">
            </td></tr>
            <tr><th>배송날짜</th><td>
                <input type="date" name="cdate">
            </td></tr>
            <tr><th>배송시간                
            </th><td>
                <input type="time" name="ctime" min="10:00" max="22:00" step="900"></td></tr>
            <tr><th>홈페이지</th>
                <td>
                    <!-- label 과 input 을 한 세트로 묶어줄 때, 
                        input 의 id 속성의 아이디명을 label 태그의 for="input id명" 지정함 -->
                    <label for="wsite">url : </label>
                    <input type="url" name="website" id="wsite">
                </td></tr>
            <tr><th>수량</th>
                <td>
                    <input type="number" name="cnum" min="10" max="100" step="10" 
                    placeholder="최소 10이상">
                </td></tr>
            <tr><th>등급</th>
                <td>
                    <input type="range" name="clevel" min="0" max="10" step="2">
                </td></tr>
            <tr><th>색상</th>
                <td>
                    <input type="color" name="pcolor">
                </td></tr>
            <tr><th colspan="2">
                <input type="submit" value="전송하기"> &nbsp;
                <input type="reset" value="입력 취소">
            </th></tr>
        </table>
    </form>
</body>
</html>
