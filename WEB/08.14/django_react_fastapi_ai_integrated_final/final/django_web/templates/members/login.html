{% extends 'base.html' %}{% block title %}로그인{% endblock %}{% block content %}<section class="card border-0 shadow-sm mx-auto" style="max-width:560px"><div class="card-body p-4"><h1 class="h3 mb-4">로그인</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}</div>{% endfor %}{% for error in form.non_field_errors %}<div class="alert alert-danger py-2">{{ error }}</div>{% endfor %}<button class="btn btn-primary w-100" type="submit">로그인</button></form></div></section>{% endblock %}
