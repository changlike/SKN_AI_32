{% extends 'base.html' %}{% block title %}회원정보 수정{% endblock %}{% block content %}<section class="card border-0 shadow-sm mx-auto" style="max-width:720px"><div class="card-body p-4"><h1 class="h3 mb-4">회원정보 수정</h1><form method="post" enctype="multipart/form-data">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary" type="submit">저장</button> <a class="btn btn-outline-secondary" href="{% url 'members:profile' %}">취소</a></form></div></section>{% endblock %}
