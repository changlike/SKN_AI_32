{% extends 'base.html' %}
{% block title %}게시글 {{ mode }}{% endblock %}
{% block content %}
<section class="card">
    <h1>게시글 {{ mode }}</h1>
    <!-- 파일 첨부를 지원하므로 multipart/form-data를 사용합니다. -->
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <button class="btn" type="submit">{{ mode }} 완료</button>
        <a class="btn secondary" href="{% url 'boards:list' %}">취소</a>
    </form>
</section>
{% endblock %}
